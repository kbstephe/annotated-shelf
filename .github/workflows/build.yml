name: Build site
# Matter mode: push an episode script (.md) and this publishes the HTML
# article pages plus the full-text RSS feed that Matter subscribes to.
# No audio rendering — Matter narrates the text itself.

on:
  push:
    branches: [main]   # side branches used to trigger builds too, leaving bot commits that needed merging
    paths:
      - ".github/workflows/build.yml"
      - "episodes/*.md"
      - "config.json"
      - "scripts/build_site.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_site.py reads first-commit dates for stable pubDate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build HTML + feed
        run: python scripts/build_site.py

      - name: Commit site output
        run: |
          git config user.name "annotated-shelf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || git commit -m "Build: site + feed [skip ci]"
          git push
