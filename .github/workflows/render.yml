name: Render episodes
# Runs on GitHub's servers whenever an episode script is pushed.
# Your laptop can be off: push a .md from anywhere (Claude Code on your
# phone, the GitHub web editor) and this renders the audio + updates the feed.

on:
  push:
    paths:
      - "episodes/*.md"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and edge-tts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install edge-tts

      - name: Render new episodes and rebuild feed
        run: python .claude/skills/audio-essay/scripts/auto_publish.py

      - name: Commit rendered audio
        run: |
          git config user.name "annotated-shelf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Render: new episode audio [skip ci]"
          git push
